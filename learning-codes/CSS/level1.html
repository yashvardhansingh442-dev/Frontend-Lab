<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets browser tab title -->
    <title>CSS Level 1</title>

    <!-- Links external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main heading with an ID -->
    <h1 id="hello">Hello from this side!</h1>

    <!-- Heading with a class -->
    <h1 class="myclass">
        Hi learning CSS just checking out the style function!
    </h1>

    <!-- Paragraph with a class -->
    <p class="myclass">This is a normal text</p>

    <!-- Button with inline CSS -->
    <button style="border-radius: 5px;">Click me!</button>

</body>

</html>
