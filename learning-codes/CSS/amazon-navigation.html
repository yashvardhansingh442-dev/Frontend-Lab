<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amazon Navbar</title>

    <!-- Connects the external CSS stylesheet -->
    <link rel="stylesheet" href="amazon-navigation.css">
</head>

<body>

    <!-- Main navigation bar containing all navigation items -->
    <div id="navbar">

        <!-- Website logo or brand name -->
        <a id="logo" href="#">amazon.in</a>

        <!-- Navigation links -->
        <a href="#">Account</a>
        <a href="#">My Cart</a>
        <a href="#">Contact Us</a>

        <!-- Search section containing input and button -->
        <div id="search">
            <input type="text" placeholder="search Amazon.in">
            <button>Search</button>
        </div>

    </div>

</body>
</html>
