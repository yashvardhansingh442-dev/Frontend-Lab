<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice 3</title>

    <!-- External CSS stylesheet -->
    <link rel="stylesheet" href="practice3.css">

    <!-- Internal CSS using style tag -->
    <style>
        .blue-button {
            background-color: blue;
            color: white;
            border-radius: 8px;
        }
    </style>

</head>

<body>

    <!-- Button 1: External CSS -->
    <button class="green-button">Green Button</button>

    <!-- Button 2: Internal CSS -->
    <button class="blue-button">Blue Button</button>

    <!-- Button 3: Inline CSS -->
    <button style="background-color: pink; border-radius: 8px;">
        Pink Button
    </button>

</body>

</html>
