
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 15th Website</title>
</head>

<body>

    <h1>Registration Form</h1>
    <p>Please fill in your details below.</p>

    <form action="action_page.php" method="GET">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <div>
                <label for="fname">First Name :</label>
                <input type="text" id="fname" name="fname"
                    placeholder="Spongebob" autocomplete="given-name" required>
            </div>

            <br>

            <div>
                <label for="lname">Last Name :</label>
                <input type="text" id="lname" name="lname"
                    placeholder="Squarepants" autocomplete="family-name" required>
            </div>

            <br>

            <div>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email"
                    placeholder="SPants@gmail.com" autocomplete="email" required>
            </div>

            <br>

            <div>
                <label for="phone">Phone # :</label>
                <input type="tel" id="phone" name="phone"
                    placeholder="1234567890" pattern="[0-9]{10}"
                    title="Enter a 10-digit phone number" required>
            </div>

            <br>

            <div>
                <label for="bdate">Birthdate :</label>
                <input type="date" id="bdate" name="bdate" required>
            </div>

            <br>

            <div>
                <label>Gender :</label>

                <label for="male">Male</label>
                <input type="radio" id="male" name="gender" value="Male" required>

                <label for="female">Female</label>
                <input type="radio" id="female" name="gender" value="Female">

                <label for="other">Other</label>
                <input type="radio" id="other" name="gender" value="Other">
            </div>

        </fieldset>

        <br>

        <!-- Account Information -->
        <fieldset>
            <legend>Account Information</legend>

            <div>
                <label for="username">Username :</label>
                <input type="text" id="username" name="username"
                    minlength="4" maxlength="20" placeholder="Username" required>
            </div>

            <br>

            <div>
                <label for="pass">Password :</label>
                <input type="password" id="pass" name="pass"
                    minlength="8" maxlength="20" required>
            </div>

            <br>

            <div>
                <label for="confirm">Confirm Password :</label>
                <input type="password" id="confirm" name="confirm" required>
            </div>

        </fieldset>

        <br>

        <!-- Additional Information -->
        <fieldset>
            <legend>Additional Information</legend>

            <div>
                <label for="address">Address :</label>
                <input type="text" id="address" name="address"
                    placeholder="Enter your address">
            </div>

            <br>

            <div>
                <label for="city">City :</label>
                <input type="text" id="city" name="city"
                    placeholder="Enter your city">
            </div>

            <br>

            <div>
                <label for="country">Country :</label>
                <select id="country" name="country" required>
                    <option value="">Select Country</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                </select>
            </div>

            <br>

            <div>
                <label for="quantity">Quantity :</label>
                <input type="number" id="quantity" name="quantity"
                    min="1" max="99" value="1">
            </div>

            <br>

            <div>
                <label for="payment">Payment :</label>
                <select id="payment" name="payment">
                    <option value="visa">Visa</option>
                    <option value="mastercard">Mastercard</option>
                    <option value="giftcard">Gift Card</option>
                    <option value="upi">UPI</option>
                    <option value="cash">Cash</option>
                </select>
            </div>

            <br>

            <div>
                <label for="website">Website :</label>
                <input type="url" id="website" name="website"
                    placeholder="https://example.com">
            </div>

            <br>

            <div>
                <label for="color">Favorite Color :</label>
                <input type="color" id="color" name="color">
            </div>

            <br>

            <div>
                <label for="file">Upload File :</label>
                <input type="file" id="file" name="file">
            </div>

            <br>

            <div>
                <label for="comments">Comments :</label>
                <br>
                <textarea id="comments" name="comments"
                    rows="5" cols="30"
                    placeholder="Write something..."></textarea>
            </div>

        </fieldset>

        <br>

        <!-- Preferences -->
        <fieldset>
            <legend>Preferences</legend>

            <div>
                <label for="subscribe">Subscribe :</label>
                <input type="checkbox" id="subscribe"
                    name="subscribe" value="yes" checked>
            </div>

            <br>

            <div>
                <label for="terms">I agree to Terms and Conditions :</label>
                <input type="checkbox" id="terms"
                    name="terms" value="accepted" required>
            </div>

        </fieldset>

        <br>

        <!-- Form Controls -->
        <div>
            <input type="reset" value="Reset Form">
        </div>

        <br>

        <div>
            <input type="submit" value="Create Account">
        </div>

    </form>

</body>

</html>
