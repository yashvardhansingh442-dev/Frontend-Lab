
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed on browser tab -->
    <title>My 14th Website</title>
</head>

<body>

    <!--
        ANCHOR TAG (<a>):

        Used to create hyperlinks that redirect users
        to another webpage or website.

        href = Specifies the destination URL.

        Here, clicking the link will open Google.

        CSS properties are used to make the anchor tag
        look like a button.
    -->

    <a href="https://www.google.com"
       style="background-color: #333333;
              color: #00ff00;
              padding: 10px 20px;
              border-radius: 5px;
              text-decoration: none;">

        Click me

    </a>

</body>
</html>
