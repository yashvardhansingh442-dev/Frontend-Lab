
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed on browser tab -->
    <title>My 14th Website</title>
</head>

<body>

    <!--
        ANCHOR TAG (<a>):

        Used to create hyperlinks that redirect users
        to another webpage or website.

        href = Specifies the destination URL.

        Here, clicking the button will open Google.
    -->

    <a href="https://www.google.com">

        <!--
            BUTTON TAG (<button>):

            Creates a clickable button.

            background-color = Sets the button background.
            color = Sets the text color.
            border-radius = Rounds the button corners.

            disabled = Disables the button.
        -->

        <button
            style="background-color: #333333;
                   color: #00ff00;
                   border-radius: 5px;">

            Click me

        </button>

    </a>

</body>
</html>
