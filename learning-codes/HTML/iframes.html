
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title displayed on the browser tab -->
    <title>My 12th Website</title>
</head>

<body>

    <!--
        IFRAME (Inline Frame):
        An iframe is used to embed another webpage or external content
        inside the current HTML document.

        Common uses:
        1. Embedding websites
        2. Displaying YouTube videos
        3. Embedding Google Maps
        4. Displaying external documents

        Note:
        Some websites block iframe embedding for security reasons.
    -->

    <!-- Embedding Wikipedia inside our webpage -->
    <iframe
        src="https://www.wikipedia.org/"
        width="100%"
        height="770"
        title="Wikipedia Website">

        <!-- This message appears if the browser does not support iframes -->
        Your browser does not support iframes.

    </iframe>

</body>

</html>
