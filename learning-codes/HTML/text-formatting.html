
<!DOCTYPE html>
<html>

<head>
    <title>This is my sixth website</title> <!-- Title shown on browser tab -->
</head>

<body>

    <!-- HTML text formatting tags -->

    <p>This is the normal text</p>

    <p>This is the <b>bold</b> text</p> <!-- Makes text bold -->

    <p>This is the <i>italic</i> text</p> <!-- Makes text italic -->

    <p>This is the <big>big</big> text</p> <!-- Makes text bigger -->

    <p>This is the <small>small</small> text</p> <!-- Makes text smaller -->

    <p>This is the <sub>subscript</sub> text</p> <!-- Moves text down -->

    <p>This is the <sup>superscript</sup> text</p> <!-- Moves text up -->

    <p>This is the <ins>inserted</ins> text</p> <!-- Underlines inserted text -->

    <p>This is the <del>deleted</del> text</p> <!-- Adds a line through text -->

    <p>This is the <mark>marked</mark> text</p> <!-- Highlights text -->

</body>
</html>
