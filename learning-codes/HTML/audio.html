
<!DOCTYPE html>
<html>

<head>
    <title>My Fourth Website</title> <!-- Title shown on browser tab -->
</head>

<body>

    <!-- audio tag is used to add audio to the webpage -->
    <audio controls autoplay muted loop>

        <!-- MP3 audio file -->
        <source src="assests/sample-9s.mp3" type="audio/mpeg">
        Your browser does not support audio.

    </audio>

    <!-- controls adds play, pause and volume buttons -->
    <!-- autoplay starts audio automatically -->
    <!-- muted starts audio without sound -->
    <!-- loop plays audio again after it ends -->

</body>
</html>
