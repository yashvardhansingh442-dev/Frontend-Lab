
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab title -->
    <title>My 13th Website</title>
</head>

<body>

    <!--
        IFRAME (Inline Frame):

        An iframe allows us to embed another HTML document
        inside our current webpage.

        Here:
        src="ad.html" loads our separate advertisement webpage.

        width="100%" makes the iframe occupy the available width.
        height="150" sets its height to 150 pixels.
        style="border: 0" removes the default iframe border.
    -->

    <iframe
        src="ad.html"
        width="100%"
        height="150"
        style="border: 0;"
        title="Advertisement">

        <!-- Fallback message if iframe is unsupported -->
        Your browser does not support iframes.

    </iframe>

</body>
</html>
