
<!DOCTYPE html>
<html>

<head>
    <title>My Eighth Website</title>

    <style>
        body {
            background-color: #f5efe6;
            font-family: Arial;
            text-align: center;
        }

        h3 {
            color: #493628;
            font-size: 28px;
        }

        table {
            margin: auto;
            width: 700px;
            border-collapse: collapse;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #493628;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            color: #493628;
        }

        tr:nth-child(even) {
            background-color: #e8d8c4;
        }

        tr:nth-child(odd) {
            background-color: #f5efe6;
        }
    </style>

</head>

<body>

    <!-- Store heading -->
    <h3>☕ Store Hours</h3>

    <!-- Store timings table -->
    <table>

        <!-- Table headings -->
        <tr>
            <th>Sunday</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th>Saturday</th>
        </tr>

        <!-- Store opening hours -->
        <tr>
            <td>Closed</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
        </tr>

    </table>

</body>
</html>
