
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the language of the website as English -->

    <title>My 11th website</title>
    <!-- Sets the title displayed on the browser tab -->

    <meta charset="UTF-8">
    <!-- Supports almost all characters and symbols -->

    <meta name="description" content="Free HTML tutorial for everyone">
    <!-- Gives a short description of the website -->

    <meta name="keywords" content="HTML, tutorial, beginners">
    <!-- Defines keywords related to the website -->

    <meta name="author" content="AVU">
    <!-- Specifies the author of the website -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the website adjust to different screen sizes -->

    <meta http-equiv="refresh" content="2">
    <!-- Automatically refreshes the webpage every 30 seconds -->

</head>

<body>

    <h1>Welcome to My Website!</h1>
    <p>This is my 11th HTML website.</p>

</body>
</html>
