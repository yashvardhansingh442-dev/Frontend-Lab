
<!DOCTYPE html>
<html>

<head>
    <title>My Fifth Website</title> <!-- Title shown on browser tab -->
</head>

<body>

    <!-- video tag is used to add videos to the webpage -->
    <video controls autoplay loop width="500" height="300">

        <!-- Source specifies the video file -->
        <source src="assests/0001-0320.mp4" type="video/mp4">
        <source src="assests/0001-0320.wav" type="video/wav">

        Your browser does not support video.

    </video>

    <!-- controls adds play, pause and volume buttons -->
    <!-- autoplay plays video automatically -->
    <!-- loop repeats the video -->
    <!-- width and height set video size -->

</body>
</html>
